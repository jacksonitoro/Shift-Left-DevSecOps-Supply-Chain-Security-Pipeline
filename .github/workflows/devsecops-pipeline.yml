name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # Required for keyless OIDC signing via Sigstore Cosign

env:
  REGISTRY: ghcr.io

jobs:
  security-audit:
    name: Shift-Left Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1: Secret Detection
      - name: Gate 1 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 2: Static Application Security Testing
      - name: Gate 2 - Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config .semgrep.yml app/

  build-and-attest:
    name: Build, Gate & Supply Chain Attestation
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Build image locally for vulnerability scanning
      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: secure-api:scan

      # Gate 3: Container Vulnerability Scanning
      - name: Gate 3 - Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-api:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push Container to GHCR
      - name: Push Container to GHCR
        if: github.event_name != 'pull_request'
        id: push-step
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Supply Chain: Software Bill of Materials (SBOM) Generation
      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM
        if: github.event_name != 'pull_request'
        run: |
          syft docker:secure-api:scan -o spdx-json=sbom.spdx.json

      - name: Upload SBOM as Pipeline Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      # Cryptographic Attestation: Sigstore Cosign Keyless Signing
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Cryptographically Sign Image (Keyless via OIDC)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest